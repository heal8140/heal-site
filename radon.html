<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ラドン | heal</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans JP",sans-serif;
  background:#f2f2f2;
  color:#333;
  line-height:1.8;
}

header{
  background:#3a3a3a;
  color:#fff;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:20px;
  font-weight:600;
}

.container{
  max-width:900px;
  margin:20px auto;
  padding:0 15px;
}

.back{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  color:#555;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tab{
  flex:1;
  padding:14px 10px;
  text-align:center;
  background:#ddd;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.tab:hover{
  background:#d0d0d0;
}

.tab.active{
  background:#3a3a3a;
  color:#fff;
}

.content{
  display:none;
}

.content.active{
  display:block;
}

.block{
  background:#fff;
  padding:22px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
  margin-bottom:20px;
}

.block h2{
  margin-top:0;
  margin-bottom:18px;
  font-size:20px;
  border-left:4px solid #3a3a3a;
  padding-left:10px;
}

.rule{
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid #e5e5e5;
}

.rule:last-child{
  margin-bottom:0;
  padding-bottom:0;
  border-bottom:none;
}

.rule h3{
  margin:0 0 10px;
  font-size:16px;
  font-weight:600;
}

.rule h4{
  margin:15px 0 8px;
  font-size:14px;
  font-weight:600;
}

.rule p{
  margin:5px 0;
  font-size:14px;
}

.image-box{
  margin-top:15px;
  text-align:center;
}

.image-box img{
  width:100%;
  max-width:900px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.note{
  margin-top:10px;
  background:#fff3cd;
  border-left:4px solid #ffcc00;
  padding:12px;
  border-radius:6px;
  font-size:13px;
}

.danger{
  margin-top:10px;
  background:#ffe5e5;
  border-left:4px solid #ff4d4d;
  padding:12px;
  border-radius:6px;
  font-size:13px;
}

.info{
  margin-top:10px;
  background:#f1f1f1;
  border-left:4px solid #9e9e9e;
  padding:12px;
  border-radius:6px;
  font-size:13px;
}

@media(max-width:768px){

  .block{
    padding:18px;
  }

  .tabs{
    gap:8px;
  }

  .tab{
    flex:1;
  }

}

</style>
</head>

<body>

<header>
  <h1>ラドンマニュアル</h1>
</header>

<div class="container">

<a href="index.html" class="back">
  ← 戻る
</a>

<div class="tabs">

  <div class="tab active" onclick="showTab('basic')">
    基本操作
  </div>

  <div class="tab" onclick="showTab('setting')">
    準備・設定
  </div>

  <div class="tab" onclick="showTab('trouble')">
    トラブル対応
  </div>

</div>

<!-- 基本操作 -->
<div id="basic" class="content active">

  <div class="block">

    <h2>基本操作</h2>

    <div class="rule">

      <h3>① ご案内方法</h3>

      <p>内容を記載</p>

      <div class="image-box">
        <img src="img/radon01.png" alt="">
      </div>

    </div>

    <div class="rule">

      <h3>② 使用方法</h3>

      <p>内容を記載</p>

      <div class="note">
        補足事項
      </div>

    </div>

  </div>

</div>

<!-- 準備・設定 -->
<div id="setting" class="content">

  <div class="block">

    <h2>準備・設定</h2>

    <div class="rule">

      <h3>① 使用前準備</h3>

      <p>内容を記載</p>

      <div class="image-box">
        <img src="img/radon02.png" alt="">
      </div>

    </div>

    <div class="rule">

      <h3>② 設定確認</h3>

      <p>内容を記載</p>

      <div class="note">
        確認事項
      </div>

    </div>

  </div>

</div>

<!-- トラブル対応 -->
<div id="trouble" class="content">

  <div class="block">

    <h2>トラブル対応</h2>

    <div class="rule">

      <h3>① エラー発生時</h3>

      <p>対応方法を記載</p>

      <div class="danger">
        不明な場合は責任者へ報告してください
      </div>

    </div>

    <div class="rule">

      <h3>② よくある質問</h3>

      <p>内容を記載</p>

    </div>

  </div>

</div>

</div>

<script>

function showTab(type){

  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove("active");

    });

  document
    .querySelectorAll(".content")
    .forEach(content => {

      content.classList.remove("active");

    });

  document
    .querySelector(
      `.tab[onclick="showTab('${type}')"]`
    )
    .classList.add("active");

  document
    .getElementById(type)
    .classList.add("active");

}

</script>

</body>
</html>
