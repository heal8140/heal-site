  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:"Noto Sans JP",sans-serif;
      background:#f2f2f2;
      color:#333;
      line-height:1.8;
    }

    header{
      background:#3a3a3a;
      color:#fff;
      padding:20px;
      text-align:center;
    }

    header h1{
      margin:0;
      font-size:20px;
      font-weight:600;
    }

    .container{
      max-width:900px;
      margin:20px auto;
      padding:0 15px;
    }

    .back{
      display:inline-block;
      margin-bottom:15px;
      text-decoration:none;
      color:#555;
      font-size:14px;
    }

    .block{
      background:#fff;
      padding:22px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
      margin-bottom:20px;
    }

    .block h2{
      margin-top:0;
      margin-bottom:18px;
      font-size:20px;
      border-left:4px solid #3a3a3a;
      padding-left:10px;
    }

    .rule{
      margin-bottom:22px;
      padding-bottom:18px;
      border-bottom:1px solid #e5e5e5;
    }

    .rule:last-child{
      margin-bottom:0;
      padding-bottom:0;
      border-bottom:none;
    }

    .rule h3{
      margin:0 0 10px;
      font-size:16px;
      font-weight:600;
    }

    .rule p{
      margin:5px 0;
      font-size:14px;
    }

    .note{
      margin-top:10px;
      background:#fff3cd;
      border-left:4px solid #ffcc00;
      padding:12px;
      border-radius:6px;
      font-size:13px;
    }

    .danger{
      margin-top:10px;
      background:#ffe5e5;
      border-left:4px solid #ff4d4d;
      padding:12px;
      border-radius:6px;
      font-size:13px;
    }

    .tight{
      margin:3px 0;
    }

    @media(max-width:768px){

      .block{
        padding:18px;
      }

    }

  </style>

</head>

<body>
