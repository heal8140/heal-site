<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans JP",sans-serif;
  background:#f2f2f2;
  color:#333;
  line-height:1.8;
}

header{
  background:#3a3a3a;
  color:#fff;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:20px;
  font-weight:600;
}

.container{
  max-width:900px;
  margin:20px auto;
  padding:0 15px;
}

.back{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  color:#555;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  padding:14px 10px;
  text-align:center;
  background:#ddd;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:0.2s;
}

.tab:hover{
  background:#d0d0d0;
}

.tab.active{
  background:#3a3a3a;
  color:#fff;
}

.content{
  display:none;
}

.content.active{
  display:block;
}

.block{
  background:#fff;
  padding:22px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  margin-bottom:20px;
}

.block h2{
  margin-top:0;
  margin-bottom:18px;
  font-size:20px;
  border-left:4px solid #3a3a3a;
  padding-left:10px;
}

.rule{
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid #e5e5e5;
}

.rule:last-child{
  margin-bottom:0;
  padding-bottom:0;
  border-bottom:none;
}

.rule h3{
  margin:0 0 10px;
  font-size:16px;
  font-weight:600;
}

.rule p{
  margin:5px 0;
  font-size:14px;
}

.image-box{
  margin-top:15px;
  text-align:center;
}

.image-box img{
  width:100%;
  max-width:900px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.note{
  margin-top:10px;
  background:#fff3cd;
  border-left:4px solid #ffcc00;
  padding:12px;
  border-radius:6px;
  font-size:13px;
}

.danger{
  margin-top:10px;
  background:#ffe5e5;
  border-left:4px solid #ff4d4d;
  padding:12px;
  border-radius:6px;
  font-size:13px;
}

footer{
  text-align:center;
  font-size:12px;
  color:#888;
  margin:40px 0 20px;
}

@media(max-width:768px){

  .block{
    padding:18px;
  }

  .tabs{
    gap:8px;
  }

  .tab{
    flex:1;
    text-align:center;
  }

}

</style>

<div class="tabs">

  <div class="tab active" onclick="showTab('tenken')">
    点検・清算
  </div>

  <div class="tab" onclick="showTab('uriage')">
    売上報告
  </div>

  <div class="tab" onclick="showTab('genkin')">
    現金入力
  </div>

</div>

<!-- 売上報告 -->
<div id="uriage" class="content">

  <div class="block">

    <h2>売上報告レシートの出し方</h2>

    <div class="rule">

      <h3>① ホーム画面の「点検・清算」を押す</h3>

      <div class="image-box">
        <img src="img/uriage01.PNG" alt="売上報告1">
      </div>

    </div>

    <div class="rule">

      <h3>② 最下部の「売上報告シート」を押す</h3>

      <div class="image-box">
        <img src="img/uriage02.png" alt="売上報告2">
      </div>

    </div>

    <div class="rule">

      <h3>③ 右下の「発行」を押す</h3>

      <div class="image-box">
        <img src="img/uriage03.PNG" alt="売上報告3">
      </div>

    </div>

    <div class="rule">

      <h3>④ レシートが発行される</h3>

      <div class="image-box">
        <img src="img/uriage04.PNG" alt="売上報告4">
      </div>

    </div>

    <div class="rule">

      <h3>⑤ レシートをまとめる</h3>

      <p>・売上報告レシートを上にする</p>
      <p>・点検・清算レシートを下にする</p>

      <div class="note">
        現金欄にマーカーで線を引く
      </div>

      <div class="image-box">
        <img
          src="img/uriage05.png"
          alt="売上報告5"
          style="max-width:260px;"
        >
      </div>

    </div>

  </div>

</div>

<!-- 現金入力 -->
<div id="genkin" class="content">

  <div class="block">

    <h2>現金売上の入力</h2>

    <div class="rule">

      <h3>① Excelへ入力</h3>

      <p>
        Excel「色々ツール」内の
      </p>

      <p>
        「現金・小口」の該当月を開いて入力する
      </p>

      <div class="image-box">
        <img src="img/genkin01.png" alt="現金入力1">
      </div>

      <div class="note">
        入力漏れ注意
      </div>

    </div>

  </div>

</div>

<script>

function showTab(type){

  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove("active");

    });

  document
    .querySelectorAll(".content")
    .forEach(content => {

      content.classList.remove("active");

    });

  document
    .querySelector(
      `.tab[onclick="showTab('${type}')"]`
    )
    .classList.add("active");

  document
    .getElementById(type)
    .classList.add("active");

}

</script>
